<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halmos Auto-Refresh Stress Test</title>
    <style>
        body {
            font-family: monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        h2 { color: #4ec9b0; }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #252526;
            border: 1px solid #3c3c3c;
            padding: 15px;
            border-radius: 5px;
            min-width: 150px;
        }
        .card span { font-size: 24px; font-weight: bold; color: #b5cea8; }
        #log-container {
            background: #111;
            border: 1px solid #333;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            font-size: 13px;
        }
        .log-success { color: #4ec9b0; }
        .log-error { color: #f44747; }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        button:hover { background: #1177bb; }
        button.stop { background: #a1260d; }
        button.stop:hover { background: #d73a25; }
    </style>
</head>
<body>

    <h2>Halmos HTTP/2 & DHE Stress Tester</h2>
    <p>Target: <code>https://localhost:8080/halmos-example/test_dhe.php?mode=lib</code></p>

    <div class="stats">
        <div class="card">Total Request<br><span id="total-req">0</span></div>
        <div class="card">Sukses (200 OK)<br><span id="success-req" style="color: #4ec9b0;">0</span></div>
        <div class="card">Gagal / Error<br><span id="fail-req" style="color: #f44747;">0</span></div>
    </div>

    <button id="toggle-btn" onclick="toggleTest()">Mulai Auto-Refresh</button>

    <h3>Live Log Terminal:</h3>
    <div id="log-container"></div>

    <script>
        const targetUrl = "https://localhost:8080/halmos-example/test_dhe.php?mode=lib";
        let isRunning = false;
        let intervalId = null;

        let totalCount = 0;
        let successCount = 0;
        let failCount = 0;

        function toggleTest() {
            const btn = document.getElementById("toggle-btn");
            if (!isRunning) {
                isRunning = true;
                btn.textContent = "Berhentikan Test";
                btn.className = "stop";
                // Jalankan request setiap 150ms (atur sesuai kecepatan yang diinginkan)
                intervalId = setInterval(sendRequest, 150);
            } else {
                isRunning = false;
                btn.textContent = "Mulai Auto-Refresh";
                btn.className = "";
                clearInterval(intervalId);
            }
        }

        async function sendRequest() {
            totalCount++;
            const currentId = totalCount;
            const startTime = performance.now();
            const logContainer = document.getElementById("log-container");

            try {
                // Menggunakan fetch dengan mode cors / no-cors sesuai kebutuhan local
                const response = await fetch(targetUrl, { 
                    method: 'GET',
                    cache: 'no-store' 
                });

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                if (response.ok) {
                    successCount++;
                    document.getElementById("success-req").textContent = successCount;
                    logContainer.innerHTML += `<div class="log-success">[#${currentId}] Status: ${response.status} OK | Waktu: ${duration} ms</div>`;
                } else {
                    failCount++;
                    document.getElementById("fail-req").textContent = failCount;
                    logContainer.innerHTML += `<div class="log-error">[#${currentId}] Status: HTTP Error ${response.status}</div>`;
                }
            } catch (err) {
                failCount++;
                document.getElementById("fail-req").textContent = failCount;
                logContainer.innerHTML += `<div class="log-error">[#${currentId}] Koneksi Gagal / Timeout (${err.message})</div>`;
            }

            document.getElementById("total-req").textContent = totalCount;
            // Auto-scroll log ke bawah
            logContainer.scrollTop = logContainer.scrollHeight;
        }
    </script>

</body>
</html>
